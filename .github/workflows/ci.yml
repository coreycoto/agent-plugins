name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --locked --group dev
      - run: uv run --locked python scripts/validate_agent_plugins.py
      - run: uv run --locked python scripts/build_codex_package.py
      - run: uv run --locked python scripts/build_codex_package.py --check
      - run: uv run --locked ruff check adapters scripts tests evals/owned-workflows plugins/product-development/skills/maintain-verification/scripts

      - name: Set up Node for archive and legacy hash contract tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: uv run --locked pytest

      - name: Validate self-contained packages and optional legacy declarations
        run: uv run --locked python scripts/verify_skill_dependencies.py

      - name: Upload built plugin candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-plugins-${{ github.sha }}
          path: dist/plugin-packages/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
